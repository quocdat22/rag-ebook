<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-arch-title rag-arch-desc">
  <title id="rag-arch-title">Kiến trúc rag-ebook</title>
  <desc id="rag-arch-desc">Client layer gọi vào pipeline xử lý gồm ingest, embed, retrieve, generate; ChromaDB là hub dữ liệu dùng chung giữa luồng indexing và query, Ollama và DeepSeek là hai dịch vụ ngoài được gọi qua API.</desc>
  <style>
    .node-name  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
    .sublabel   { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace; font-size: 9px; font-weight: 400; fill: #4f5d75; }
    .eyebrow-svg{ font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace; font-size: 7px; font-weight: 500; letter-spacing: 0.14em; fill: rgba(45,49,66,0.40); }
    .callout    { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #2d3142; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#f5f5f5"/>

  <!-- ===== zones (bg -> zones -> arrows -> nodes) ===== -->
  <rect x="60" y="44" width="880" height="108" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="72" y="48" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="108" y="57" class="eyebrow-svg" text-anchor="middle">CLIENT LAYER</text>

  <rect x="60" y="192" width="880" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="72" y="196" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="128" y="205" class="eyebrow-svg" text-anchor="middle">PROCESSING PIPELINE</text>

  <rect x="60" y="448" width="880" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="72" y="452" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="124" y="461" class="eyebrow-svg" text-anchor="middle">EXTERNAL SERVICES</text>

  <!-- ===== arrows ===== -->
  <!-- FastAPI -> Ingest & chunk -->
  <path d="M476,132 V170 Q476,178 468,178 H200 Q192,178 192,186 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- FastAPI -> Retrieve -->
  <path d="M476,132 V170 Q476,178 484,178 H784 Q792,178 792,186 V224" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Ingest & chunk -> Embed -->
  <path d="M192,280 L192,320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Retrieve -> Generate & cite -->
  <path d="M792,280 L792,320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Embed -> Ollama (external call) -->
  <path d="M192,376 L192,480" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <!-- Generate & cite -> DeepSeek (external call) -->
  <path d="M792,376 L792,480" fill="none" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <!-- Embed -> ChromaDB (write) -->
  <path d="M192,376 V420 Q192,428 200,428 H452 Q460,428 460,436 V480" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <!-- Retrieve -> ChromaDB (read) -->
  <path d="M704,252 H548 Q540,252 540,260 V480" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== client nodes ===== -->
  <rect x="376" y="76" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="476" y="100" text-anchor="middle" class="node-name">FastAPI</text>
  <text x="476" y="116" text-anchor="middle" class="sublabel">/documents /query /health</text>

  <rect x="620" y="76" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="710" y="100" text-anchor="middle" class="node-name">Streamlit</text>
  <text x="710" y="116" text-anchor="middle" class="sublabel">demo UI, in-process</text>

  <!-- ===== processing nodes ===== -->
  <rect x="104" y="224" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="192" y="248" text-anchor="middle" class="node-name">Ingest &amp; chunk</text>
  <text x="192" y="264" text-anchor="middle" class="sublabel">PDF → chunks, ≤700 tok</text>

  <rect x="704" y="224" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="792" y="248" text-anchor="middle" class="node-name">Retrieve</text>
  <text x="792" y="264" text-anchor="middle" class="sublabel">embed query · Chroma read</text>

  <rect x="104" y="320" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="192" y="344" text-anchor="middle" class="node-name">Embed</text>
  <text x="192" y="360" text-anchor="middle" class="sublabel">chunk → vector, 1024-dim</text>

  <rect x="704" y="320" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="792" y="344" text-anchor="middle" class="node-name">Generate &amp; cite</text>
  <text x="792" y="360" text-anchor="middle" class="sublabel">answer + citations[n]</text>

  <!-- ===== external nodes ===== -->
  <rect x="104" y="480" width="176" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="192" y="504" text-anchor="middle" class="node-name">Ollama</text>
  <text x="192" y="520" text-anchor="middle" class="sublabel">local embedding model</text>

  <rect x="400" y="480" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="500" y="507" text-anchor="middle" class="node-name">ChromaDB</text>
  <text x="500" y="524" text-anchor="middle" class="sublabel">vector store, persist</text>

  <rect x="704" y="480" width="176" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="792" y="504" text-anchor="middle" class="node-name">DeepSeek API</text>
  <text x="792" y="520" text-anchor="middle" class="sublabel">LLM, temperature 0.2</text>

  <!-- ===== editorial callout ===== -->
  <path d="M500,544 L500,568" fill="none" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="500" y="588" text-anchor="middle" class="callout">Hub dùng chung — indexing ghi vào, retrieval đọc ra.</text>
</svg>
