[project]
name = "rag-ebook"
version = "0.1.0"
description = "RAG system for technical PDF ebooks (MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# Application-style project: modules live directly under src/ (src.config, src.ingestion, ...),
# imported via cwd/pythonpath, not installed as a package — so uv must not build it.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                # để test import được `src.*`
markers = [
    "integration: cần service thật (Ollama/DeepSeek), bỏ qua trong CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = ["."]
explicit_package_bases = true
